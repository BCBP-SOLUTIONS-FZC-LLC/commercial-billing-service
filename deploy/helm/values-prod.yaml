# Production (live keys only here, BIL-OPS-7). Account ids are set by the
# deploy pipeline (--set) from Terraform outputs.
env:
  APP_ENV: prod
  TENANT_APP_BASE_URL: https://app.bcbpsolutions.com
  SNS_BILLING_EVENTS_TOPIC_ARN: arn:aws:sns:ap-south-1:000000000000:billing-events
  SQS_TENANT_BILLING_QUEUE_URL: https://sqs.ap-south-1.amazonaws.com/000000000000/tenant-billing-q
  SQS_USAGE_BILLING_QUEUE_URL: https://sqs.ap-south-1.amazonaws.com/000000000000/usage-billing-q
externalSecret:
  secretPath: commercial/prod/billing
gateway:
  hostnames: [api.bcbpsolutions.com]
  tenant:
    corsOrigins: [https://app.bcbpsolutions.com]
