# commercial-billing — LLD §13.1 (Kubernetes resources), §13.2 (CronJobs),
# §10.2 (network), §10.5 (secrets), §12 (configuration).
# Install into namespace "billing" (helm-check renders with --namespace billing).

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/bcbp-solutions-fzc-llc/commercial-billing
  tag: ""            # CI sets the git SHA; falls back to appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  # ServiceAccount commercial-billing (CD-19): its SPIFFE identity is what
  # Core, RP and Entitlements admit (cluster.local/ns/billing/sa/commercial-billing).
  name: commercial-billing
  # eks.amazonaws.com/role-arn: the IRSA role for SNS / SQS / Glue (policy in
  # deploy/iam/). Required in staging and prod: the chart fails to render
  # without it; the deploy pipeline sets it (release.yml, BILLING_IRSA_ROLE_ARN).
  annotations: {}

service:
  port: 8080
  metricsPort: 9090

# Deployment (§13.1): 2 replicas minimum, spread across 3 AZs.
replicaCount: 2
# Shutdown: preStop sleep (endpoints leave the gateway and mesh), then
# SIGTERM; the app's drain (HTTP, workers, pools) must fit in the rest:
# terminationGracePeriodSeconds - preStopSleepSeconds = 50 s.
terminationGracePeriodSeconds: 60
preStopSleepSeconds: 10             # Kubernetes-native sleep action (k8s >= 1.30; distroless has no shell)
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

jobResources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# HPA (§13.1): 2–4, CPU 70 %, plus the webhook backlog as an external metric
# (prometheus-adapter exposes commercial_billing_webhook_backlog).
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  webhookBacklog:
    enabled: true
    metricName: commercial_billing_webhook_backlog
    averageValue: "200"

podDisruptionBudget:
  minAvailable: 1

# Istio (BIL-AUTH-3, §13.1). The server and the CronJobs run the sidecar as
# a Kubernetes native sidecar (Istio >= 1.24, Kubernetes >= 1.29). The
# sidecar's inbound listener appends the verified client certificate to
# X-Forwarded-Client-Cert (APPEND_FORWARD, the sidecar default; ProxyConfig's
# forwardClientCertDetails applies to gateways only); B-I1 reads its caller
# from the last element. PeerAuthentication STRICT keeps plaintext callers
# from supplying that element themselves.
# staging and prod refuse to render with peerAuthentication,
# authorizationPolicy or networkPolicy disabled (_helpers.tpl validate).
istio:
  peerAuthentication:
    enabled: true
  # Render AuthorizationPolicy (L7, mTLS identities).
  authorizationPolicy:
    enabled: true
  gatewayPrincipal: cluster.local/ns/gateway/sa/envoy-gateway
  bffPrincipal: cluster.local/ns/bff/sa/bff-signup

podAnnotations: {}
podLabels: {}

probes:
  timeoutSeconds: 6   # above the app's 5 s dependency-check bound (router.go probeTimeout)
  startup:
    path: /healthz
    periodSeconds: 5
    failureThreshold: 24
  liveness:
    path: /healthz
    periodSeconds: 15
    failureThreshold: 3
  readiness:
    path: /readyz
    periodSeconds: 10
    failureThreshold: 3

# Non-secret configuration (§12). Values left empty are set per environment.
env:
  APP_NAME: commercial-billing        # fixed (CD-17): service label on metrics, spans, logs
  APP_ENV: prod                       # local|dev|test|staging|prod
  OBSERVABILITY_DOMAIN: commercial
  APP_PORT: "8080"
  METRICS_PORT: "9090"
  REQUEST_TIMEOUT: 30s
  LOG_LEVEL: info
  RUN_MIGRATIONS: "false"             # the migrate hook Job owns migrations
  MIGRATE_TIMEOUT: 10m
  # Postgres (§4), read by platform-pgcommon (ConfigFromEnv). Secrets:
  # DATABASE_URL (billing_app, RLS) and MIGRATION_DATABASE_URL (direct RDS,
  # not PgBouncer). The system and audit-drainer pools are the same pgcommon
  # config with their own role (PG_SYSTEM_* / PG_AUDIT_DRAINER_*, §3.3).
  PG_SSLMODE: require
  PG_SYSTEM_USER: billing_system
  PG_AUDIT_DRAINER_USER: billing_audit_drainer
  PG_MAX_CONNS: "10"
  PG_MIN_CONNS: "0"
  PG_SYSTEM_MAX_CONNS: "4"
  PG_AUDIT_DRAINER_MAX_CONNS: "2"
  PG_BOUNCER_MODE: "true"
  PG_STATEMENT_TIMEOUT: 5s     # per statement (pgcommon), §12
  PG_LOCK_TIMEOUT: 2s
  # Bus (§7).
  AWS_REGION: ap-south-1
  SNS_BILLING_EVENTS_TOPIC_ARN: ""
  GLUE_REGISTRY_NAME: billing-events
  SQS_TENANT_BILLING_QUEUE_URL: ""
  # usage-billing-q stays off until UsagePeriodClosed is ratified (BL-OQ-24);
  # the queue URL is required only when this is "true".
  USAGE_BILLING_CONSUMER_ENABLED: "false"
  SQS_USAGE_BILLING_QUEUE_URL: ""
  SQS_MAX_RECEIVE_COUNT: "4"
  SQS_WAIT_TIME_SECONDS: "20"
  SQS_VISIBILITY_TIMEOUT: 60s
  OUTBOX_POLL_INTERVAL: 500ms
  OUTBOX_BATCH_SIZE: "50"
  OUTBOX_MAX_ATTEMPTS: "5"
  OUTBOX_RETENTION_DAYS: "8"
  # Read by platform-events' config (LoadSQS / LoadOutbox); Billing's §12
  # values above (wait, visibility, max receive, poll, batch, attempts) are
  # applied on top of them.
  SQS_CONCURRENCY: "1"
  SQS_HANDLER_TIMEOUT: 20s
  SQS_DRAIN_TIMEOUT: 15s
  SQS_QUEUE_DEPTH_INTERVAL: 60s    # platform_queue_depth / platform_dlq_depth (BillingDLQNotEmpty)
  OUTBOX_PUBLISH_TIMEOUT: 10s
  PROCESSED_EVENTS_TTL_DAYS: "8"
  # Dependencies (§18).
  CORE_BASE_URL: http://iam-org-membership.iam.svc.cluster.local:8080
  RP_BASE_URL: http://iam-realm-provisioner.iam.svc.cluster.local:8080
  ENTITLEMENTS_BASE_URL: http://commercial-entitlements.commercial.svc.cluster.local:8080
  TENANT_APP_BASE_URL: ""
  # Payment providers (§3.4, §3.5).
  ENABLED_PAYMENT_PROVIDERS: stripe,manual
  DEFAULT_PAYMENT_PROVIDER: stripe
  PROVIDER_CERT_SUITE_VERSION: cert-1.0
  DEFAULT_CURRENCY: USD
  # Gates (§12): off by default; never switched on here.
  OPERATOR_PATH_LIVE: "false"         # BIL-AUTH-6: operator routes 403 until IAM's operator path is live
  FEATURE_DIRECT_SIGNUP: "false"
  FEATURE_TOKEN_ADDONS: "false"
  FEATURE_SEAT_PURCHASE: "true"
  AUTO_PAUSE_ON_OPERATOR_SUSPENSION: "true"
  AUTO_REVERT_ON_EFW: "false"
  BFF_CALLER_PRINCIPAL: cluster.local/ns/bff/sa/bff-signup
  # Audit (platform-audit, §3.3).
  AUDIT_LOG_BASE_URL: http://iam-audit-log.iam.svc.cluster.local:8080
  AUDIT_SOURCE_SERVICE: commercial-billing
  AUDIT_CALLER_DOMAIN: commercial
  # Observability (§11).
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector.observability.svc.cluster.local:4317
  OTEL_TRACES_SAMPLER_ARG: "0.2"
  PUSHGATEWAY_URL: http://pushgateway.observability.svc.cluster.local:9091

# Plain values only the server gets, on top of env (none by default).
serverEnv: {}

# Secret keys (§10.5): never in values; OpenBao via External Secrets Operator.
# Each workload gets only the keys its binary reads.
secretKeys:
  # cmd/server. MIGRATION_DATABASE_URL is added only when env.RUN_MIGRATIONS
  # is "true" (never in Kubernetes by default).
  server:
    - DATABASE_URL
    - PG_SYSTEM_PASSWORD
    - PG_AUDIT_DRAINER_PASSWORD    # the auditoutbox.Runner's pool
    - STRIPE_API_KEY
    - STRIPE_WEBHOOK_SECRETS       # B-W1 signature check
    - LOG_HASH_SALT
  # cmd/jobs: app and system pools, the provider, log hashing. The Stripe
  # adapter refuses to build without a webhook secret, so jobs that call
  # Stripe need STRIPE_WEBHOOK_SECRETS too. No audit drainer (jobs only
  # enqueue), no migration DSN.
  jobs:
    - DATABASE_URL
    - PG_SYSTEM_PASSWORD
    - STRIPE_API_KEY
    - STRIPE_WEBHOOK_SECRETS
    - LOG_HASH_SALT
  # cmd/migrate: the schema owner's direct DSN only, in its own Secret.
  migrate:
    - MIGRATION_DATABASE_URL

externalSecret:
  enabled: true
  secretStoreName: openbao
  secretStoreKind: ClusterSecretStore
  secretPath: commercial/billing
  refreshInterval: 1h
  targetSecretName: ""

# Used only when externalSecret.enabled is false (dev): a pre-created Secret.
existingSecret: ""

# Migrate hook Job (§13.1): pre-install / pre-upgrade, cmd/migrate. It runs
# as its own ServiceAccount commercial-billing-migrate and reads its own
# Secret commercial-billing-migrate-secrets, both hooks created just before
# it (the release's ServiceAccount and Secret do not exist yet on a first
# install). The ServiceAccount and Secret are deleted whether the Job
# succeeds or fails (a failed Job is kept for its logs; Helm >= 3.19 is
# needed for the failure case, release.yml pins it).

migrate:
  enabled: true
  backoffLimit: 1
  # The whole Job (both attempts) stops before release.yml's helm
  # --timeout=10m, so Helm sees the hook fail instead of timing out on it;
  # MIGRATE_TIMEOUT (below it) lets cmd/migrate exit cleanly first.
  activeDeadlineSeconds: 480
  existingSecret: ""   # externalSecret disabled only: Secret with MIGRATION_DATABASE_URL (default existingSecret)
  env:                 # plain values on top of env
    MIGRATE_TIMEOUT: 7m

# CronJobs (§13.2) — one binary, --job=<name>; names and schedules match
# cmd/jobs (helm-check asserts it).
cronjobs:
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  activeDeadlineSeconds: 900
  # Plain values on top of env for every CronJob: one job runs at a time per
  # pod, so its pools stay small (ten CronJobs can overlap the server's
  # connections on PgBouncer).
  env:
    PG_MAX_CONNS: "3"
    PG_MIN_CONNS: "0"
    PG_SYSTEM_MAX_CONNS: "2"
  jobs:
    saga-sweeper: "* * * * *"
    seat-renewal: "*/15 * * * *"
    downgrade-apply: "*/15 * * * *"
    purchase-expiry: "*/5 * * * *"
    seat-projection-check: "7,37 * * * *"
    pii-minimisation: "0 5 * * *"
    outbox-prune: "0 3 * * *"
    processed-events-prune: "0 4 * * *"
    renewal-repricing: "20 * * * *"
    idempotency-prune: "30 4 * * *"

# NetworkPolicy (§10.2).
networkPolicy:
  enabled: true
  gatewayNamespace: gateway
  monitoringNamespace: monitoring
  bffNamespace: bff
  bffPodLabels:
    app.kubernetes.io/name: bff-signup
  observabilityNamespace: observability     # OTel collector, Pushgateway
  istioNamespace: istio-system               # istiod (sidecar xDS and certificates, 15012)
  iamNamespace: iam                          # Core, RP, Audit Log
  iamPodNames:
    - iam-org-membership
    - iam-realm-provisioner
    - iam-audit-log
  # CronJobs: Core (I-11, I-18) and RP (RP-3 from saga-sweeper) only.
  jobIamPodNames:
    - iam-org-membership
    - iam-realm-provisioner
  entitlementsNamespace: commercial
  entitlementsPodName: commercial-entitlements
  # RDS / PgBouncer subnets. Required in staging and prod (the chart fails
  # without it; release.yml sets it from BILLING_POSTGRES_CIDRS); empty in
  # dev means any destination on the Postgres ports.
  postgresCIDRs: []
  postgresPort: 5432
  pgbouncerPort: 6432
  # HTTPS (443) egress. The default rule admits public addresses only
  # (0.0.0.0/0 minus RFC 1918): Stripe and the public AWS endpoints. Go-live
  # check: when SNS, SQS, Glue or STS resolve to VPC interface endpoints, or
  # outbound traffic leaves through an egress gateway, those addresses are
  # private and the server cannot reach Glue at start-up (it crash-loops).
  # awsEndpointCIDRs: the interface endpoints' subnets, server only (the
  # CronJobs and the migrate Job do not call AWS). release.yml sets it from
  # BILLING_AWS_ENDPOINT_CIDRS.
  awsEndpointCIDRs: []
  # Mesh egress gateway (Stripe and AWS through it), server and CronJobs;
  # empty namespace = none.
  egressGateway:
    namespace: ""
    podLabels: {}            # e.g. {istio: egressgateway}; empty = any pod in the namespace

# Gateway API routes (§13.1): tenant, operator, webhook.
gateway:
  enabled: true
  parentRef:
    name: platform-gateway
    namespace: gateway
    sectionName: https
  hostnames: []
  tenant:
    rateLimitRPS: 20          # per tenant (x-tenant-id)
    corsOrigins: []           # TENANT_APP_BASE_URL origin
  operator:
    # Platform-realm jwt_authn provider (AuthZ LLD OP-G2). Rendered on the
    # operator route only when issuer and jwksURI are set per environment.
    jwt:
      provider: platform-edge
      issuer: ""
      jwksURI: ""
    # Every Billing operator route, B-O1 to B-O17 (§5.3, BL-OQ-9): a route
    # missing here is unreachable through the gateway. TestHelmOperatorRoutes
    # compares this list with the code's route catalogue.
    routes:
      - { id: B-O1, method: POST, path: "/api/v1/operator/tenants/:id/conversions" }
      - { id: B-O2, method: POST, path: "/api/v1/operator/tenants/:id/adjustments" }
      - { id: B-O3, method: POST, path: "/api/v1/operator/tenants/:id/refunds" }
      - { id: B-O4, method: GET, path: "/api/v1/operator/tenants/:id/invoices" }
      - { id: B-O5, method: POST, path: "/api/v1/operator/billing/reconciliation-runs" }
      - { id: B-O6, method: GET, path: "/api/v1/operator/billing/reconciliation-runs/:run_id" }
      - { id: B-O7, method: GET, path: "/api/v1/operator/tenants/:id/subscription" }
      - { id: B-O8, method: POST, path: "/api/v1/operator/tenants/:id/conversion-reversals" }
      - { id: B-O9, method: POST, path: "/api/v1/operator/tenants/:id/conversion-sagas/:saga_id/actions" }
      - { id: B-O10, method: PUT, path: "/api/v1/operator/tenants/:id/collection-pause" }
      - { id: B-O11, method: POST, path: "/api/v1/operator/billing/plan-prices" }
      - { id: B-O12, method: POST, path: "/api/v1/operator/billing/token-packs" }
      - { id: B-O13, method: POST, path: "/api/v1/operator/billing/webhook-events/:provider/:provider_event_id/replay" }
      - { id: B-O14, method: POST, path: "/api/v1/operator/billing/provider-certifications" }
      - { id: B-O15, method: POST, path: "/api/v1/operator/billing/provider-certifications/:cert_id/revoke" }
      - { id: B-O16, method: POST, path: "/api/v1/operator/tenants/:id/invoices/:invoice_id/disposition" }
      - { id: B-O17, method: POST, path: "/api/v1/operator/billing/provider-certifications/:cert_id/review" }
  webhook:
    # Per client IP (sourceCIDR Distinct, one bucket per IPv4 and per IPv6
    # address), §10.3. Go-live check: the rate limit's client IP and
    # allowedSourceCIDRs (clientCIDRs) are only the real caller's when the
    # platform ClientTrafficPolicy trusts the load balancer's X-Forwarded-For
    # hop (clientIPDetection.xForwardedFor.numTrustedHops). Otherwise every
    # request carries the load balancer's address: one shared bucket, and an
    # allow-list that admits all or nothing.
    rateLimitRPS: 50
    # Source ranges admitted to B-W1; empty = any (the signature is the
    # control, BIL-PAY-2). Stripe publishes its webhook source IPs at
    # https://docs.stripe.com/ips (https://stripe.com/files/ips/ips_webhooks.json);
    # set them per environment as /32 entries and update them when Stripe does.
    allowedSourceCIDRs: []

# §11.5 dashboard as a ConfigMap for Grafana's dashboard sidecar.
dashboard:
  enabled: true
  namespace: ""     # empty: the release namespace

# How Prometheus reaches /metrics (port service.metricsPort). LLD §13.1:
# the platform's Prometheus runs outside the mesh, hence the default.
#   plaintext  the metrics port alone is PERMISSIVE (every other port stays
#              STRICT). A plaintext scrape has no peer identity, so the
#              AuthorizationPolicy cannot match the monitoring namespace:
#              it admits GET on the metrics port from monitoringCIDRs (the
#              Prometheus pod CIDRs) when set, otherwise from any source,
#              and the NetworkPolicy admits only the monitoring namespace
#              on that port. The port serves /metrics only.
#   mesh       Prometheus has an Istio identity (its own sidecar, or
#              ServiceMonitor tlsConfig with the mesh certificates):
#              STRICT on every port, authorized by namespace.
# Go-live check: pick the mode the platform's Prometheus actually uses; a
# wrong one gets every scrape refused (403 or TLS failure), which silences
# every alert and the HPA's external metric.
metrics:
  scrapeMode: plaintext      # plaintext | mesh
  monitoringCIDRs: []        # plaintext only: Prometheus source ranges, e.g. [10.0.32.0/20]

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}
