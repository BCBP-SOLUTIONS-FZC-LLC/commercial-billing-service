{{- include "commercial-billing.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "commercial-billing.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "commercial-billing.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "commercial-billing.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "commercial-billing.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # BIL-AUTH-3: the sidecar's inbound listener appends the verified
        # client certificate to X-Forwarded-Client-Cert (Istio's sidecar
        # default, APPEND_FORWARD); B-I1 reads the last element. The
        # PeerAuthentication STRICT of this chart makes sure that element
        # always comes from mTLS, never from a plaintext caller.
        {{- include "commercial-billing.istioAnnotations" . | nindent 8 }}
        prometheus.io/scrape: "false"   # ServiceMonitor scrapes the metrics port
        {{- if not .Values.externalSecret.enabled }}
        checksum/secret-name: {{ include "commercial-billing.secretName" . | sha256sum | trunc 16 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "commercial-billing.serviceAccountName" . }}
      # No Kubernetes API token: the app never calls the API server. The EKS
      # pod identity webhook mounts the IRSA web-identity token (aws-iam-token)
      # and Istio its istio-token as their own projected volumes regardless.
      automountServiceAccountToken: false
      # preStop sleep (endpoint removal propagates to the gateway and the
      # mesh), then SIGTERM: the app has the rest of the grace period to
      # drain HTTP, workers and pools (§13.1).
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "commercial-billing.podSecurityContext" . | nindent 8 }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "commercial-billing.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 14 }}
      {{- end }}
      containers:
        - name: commercial-billing
          image: {{ include "commercial-billing.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/commercial-billing"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          env:
            {{- include "commercial-billing.env" (dict "ctx" . "overrides" .Values.serverEnv "secretKeys" (include "commercial-billing.serverSecretKeys" . | fromJsonArray) "secretName" (include "commercial-billing.secretName" .)) | nindent 12 }}
          lifecycle:
            # Kubernetes-native sleep action (GA in 1.30): the image is
            # distroless, there is no shell for an exec sleep.
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          startupProbe:
            httpGet: { path: {{ .Values.probes.startup.path }}, port: http }
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
          livenessProbe:
            httpGet: { path: {{ .Values.probes.liveness.path }}, port: http }
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
          readinessProbe:
            httpGet: { path: {{ .Values.probes.readiness.path }}, port: http }
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "commercial-billing.containerSecurityContext" . | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
