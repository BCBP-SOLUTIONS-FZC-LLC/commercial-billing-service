{{- if .Values.externalSecret.enabled }}
# §10.5: OpenBao through External Secrets Operator; never env literals.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "commercial-billing.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "commercial-billing.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: {{ .Values.externalSecret.secretStoreKind }}
  target:
    name: {{ include "commercial-billing.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range .Values.secretKeys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.externalSecret.secretPath }}
        property: {{ . }}
    {{- end }}
{{- end }}
