{{- if .Values.externalSecret.enabled }}
# §10.5: OpenBao through External Secrets Operator; never env literals.
# The service Secret holds what the server and the CronJobs read
# (secretKeys.server + secretKeys.jobs); the schema-owner
# MIGRATION_DATABASE_URL lives only in the migrate hook's own Secret
# (migrate-job.yaml), unless the server runs migrations (RUN_MIGRATIONS=true).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "commercial-billing.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "commercial-billing.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: {{ .Values.externalSecret.secretStoreKind }}
  target:
    name: {{ include "commercial-billing.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range include "commercial-billing.serviceSecretKeys" . | fromJsonArray }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.externalSecret.secretPath }}
        property: {{ . }}
    {{- end }}
{{- end }}
