{{- if .Values.istio.authorizationPolicy.enabled }}
# §13.1: B-I1 from bff/bff-signup only; tenant, operator and webhook routes
# from the gateway only; metrics per metrics.scrapeMode. An ALLOW policy denies
# everything it does not match. It selects the server pods only
# (component=server); the CronJobs take no inbound traffic and their
# NetworkPolicy admits none.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "commercial-billing.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "commercial-billing.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "commercial-billing.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 6 }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals: [{{ .Values.istio.bffPrincipal | quote }}]
      to:
        - operation:
            methods: [POST]
            paths: [/api/v1/internal/subscriptions/authorize-and-charge]
    - from:
        - source:
            principals: [{{ .Values.istio.gatewayPrincipal | quote }}]
      to:
        - operation:
            paths: ["/api/v1/tenants/*", "/api/v1/operator/*", "/api/v1/webhooks/*"]
    {{- if eq .Values.metrics.scrapeMode "mesh" }}
    # Prometheus in the mesh: its peer identity's namespace.
    - from:
        - source:
            namespaces: [{{ .Values.networkPolicy.monitoringNamespace | quote }}]
      to:
        - operation:
            methods: [GET]
            ports: [{{ .Values.service.metricsPort | quote }}]
    {{- else }}
    # Prometheus outside the mesh scrapes in plaintext (the metrics port is
    # PERMISSIVE): no peer identity, so no namespace to match. Admitted by
    # source address when metrics.monitoringCIDRs is set; otherwise any
    # source, and the NetworkPolicy limits the port to the monitoring
    # namespace.
    - to:
        - operation:
            methods: [GET]
            ports: [{{ .Values.service.metricsPort | quote }}]
      {{- with .Values.metrics.monitoringCIDRs }}
      from:
        - source:
            ipBlocks:
              {{- toYaml . | nindent 14 }}
      {{- end }}
    {{- end }}
    # Kubelet probes (rewritten by the sidecar) and in-pod health checks.
    - to:
        - operation:
            methods: [GET]
            paths: [/healthz, /readyz]
{{- end }}
