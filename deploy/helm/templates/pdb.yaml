apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "commercial-billing.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "commercial-billing.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "commercial-billing.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 6 }}
