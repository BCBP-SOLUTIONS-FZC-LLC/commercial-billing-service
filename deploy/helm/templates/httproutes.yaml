{{- if .Values.gateway.enabled }}
{{- $g := .Values.gateway }}
{{- $fullname := include "commercial-billing.fullname" . }}
# Tenant routes (§13.1): Billing's tenant paths only, so the other services
# under /api/v1/tenants/ keep their own routes.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}-tenant
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "commercial-billing.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-route
spec:
  parentRefs:
    - name: {{ $g.parentRef.name }}
      namespace: {{ $g.parentRef.namespace }}
      sectionName: {{ $g.parentRef.sectionName }}
  {{- with $g.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path: { type: RegularExpression, value: "/api/v1/tenants/[^/]+/subscription(/.*)?" }
        - path: { type: RegularExpression, value: "/api/v1/tenants/[^/]+/payment-methods(/.*)?" }
        - path: { type: RegularExpression, value: "/api/v1/tenants/[^/]+/invoices(/.*)?" }
        - path: { type: RegularExpression, value: "/api/v1/tenants/[^/]+/token-packs" }
        - path: { type: RegularExpression, value: "/api/v1/tenants/[^/]+/token-addons(/.*)?" }
        - path: { type: RegularExpression, value: "/api/v1/tenants/[^/]+/billing-contact" }
      backendRefs:
        - name: {{ $fullname }}
          port: {{ .Values.service.port }}
---
# Operator routes (§13.1): one match per route B-O1 to B-O18 (BL-OQ-9).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "commercial-billing.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator-route
spec:
  parentRefs:
    - name: {{ $g.parentRef.name }}
      namespace: {{ $g.parentRef.namespace }}
      sectionName: {{ $g.parentRef.sectionName }}
  {{- with $g.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- /* Gateway API caps matches per rule at 64 and rules at 16: one rule per route id would exceed 16, so all matches share one rule. */}}
    - matches:
        {{- range $g.operator.routes }}
        - path: { type: RegularExpression, value: {{ regexReplaceAll ":[a-z_]+" .path "[^/]+" | quote }} }
          method: {{ .method }}
        {{- end }}
      backendRefs:
        - name: {{ $fullname }}
          port: {{ $.Values.service.port }}
---
# Webhook route (§13.1): exact path, no JWT, ext_authz off (BIL-AUTH-5).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "commercial-billing.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook-route
spec:
  parentRefs:
    - name: {{ $g.parentRef.name }}
      namespace: {{ $g.parentRef.namespace }}
      sectionName: {{ $g.parentRef.sectionName }}
  {{- with $g.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path: { type: Exact, value: /api/v1/webhooks/stripe }
          method: POST
      backendRefs:
        - name: {{ $fullname }}
          port: {{ .Values.service.port }}
{{- end }}
