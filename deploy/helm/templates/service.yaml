apiVersion: v1
kind: Service
metadata:
  name: {{ include "commercial-billing.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "commercial-billing.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "commercial-billing.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: http-metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
