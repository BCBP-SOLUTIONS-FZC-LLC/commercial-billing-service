# Contract tests against consumers' live schemas (LLD §14.4).
#
# The CI workflow runs test/contract against the vendored copies in
# test/contract/testdata/consumers. This workflow fetches the copies that
# consumers have on their main branch and runs the same suite against them,
# so a backward-incompatible change on the consumer side fails here even
# before the vendored copy is refreshed. It runs daily (consumer changes don't
# trigger Billing's CI) and on every pull request.
#
# Covered today: Entitlements' consumed schemas for TenantQuotaAddOnChanged
# (BL-OQ-4, BL-OQ-20) and, since Entitlements PR #4 (B-4, BL-OQ-28),
# TenantPlanChanged, TenantSubscriptionCancelled and TenantReactivated.
# GO_PRIVATE_TOKEN needs read access to
# commercial-entitlements-service.
name: Contract (live consumers)

"on":
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    # Every PR, whatever its base: the phase branches are stacked
    # (feat/billing-phase-N → phase N-1), so a main-only filter skipped them.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-live-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
  GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*

jobs:
  entitlements:
    name: Entitlements (main)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      # GO_PRIVATE_TOKEN is used only in this step and the schema fetch
      # below, before any code from the checkout runs (go mod download and
      # go list fetch and compile; nothing is executed). Git reads the token
      # from a credential helper defined in this step's environment, so it is
      # never written to disk and the test step (pull-request code) cannot
      # read it. Recommended: replace the long-lived PAT with a short-lived
      # GitHub App installation token (actions/create-github-app-token) scoped
      # to the platform-* repositories and commercial-entitlements-service
      # with contents:read.
      - name: Download modules (private module access)
        env:
          GO_PRIVATE_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=${GO_PRIVATE_TOKEN}"; }; f'
        run: |
          set -euo pipefail
          go mod download
          go list -deps -test ./test/contract/... >/dev/null

      - name: Fetch Entitlements' consumed schemas from main
        env:
          GH_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/consumers"
          cp -R test/contract/testdata/consumers "$dir"
          base="https://api.github.com/repos/BCBP-SOLUTIONS-FZC-LLC/commercial-entitlements-service/contents/internal/adapter/outbound/eventbus/schemas"
          # Every schema Entitlements validates Billing's events against on
          # billing-entitlements-q (ValidateConsumed, B-4, BL-OQ-28). A missing
          # file fails the run: Entitlements removed or renamed a schema.
          for stem in \
            inbound_tenant_quota_add_on_changed \
            inbound_billing_tenant_plan_changed \
            inbound_billing_tenant_subscription_cancelled \
            inbound_billing_tenant_reactivated; do
            name="$stem.json"
            out="$dir/commercial-entitlements/$name"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              "$base/$name?ref=main" -o "$out"
            if ! diff -q "test/contract/testdata/consumers/commercial-entitlements/$name" "$out" >/dev/null; then
              echo "::warning::Entitlements' $name on main differs from the vendored copy; refresh test/contract/testdata/consumers/commercial-entitlements and its commit in README.md"
            fi
          done
          echo "CONTRACT_CONSUMERS_DIR=$dir" >> "$GITHUB_ENV"

      # From here on pull-request code runs: no credentials, no module fetch.
      - name: Drop private module access
        run: |
          rm -f ~/.git-credentials
          git config --global --unset-all credential.helper || true
          {
            echo "GOPROXY=off"
            echo "GOFLAGS=-mod=readonly"
            echo "GOTOOLCHAIN=local"
          } >> "$GITHUB_ENV"

      - name: Contract tests against live schemas
        run: go test ./test/contract/... -count=1 -timeout 300s
