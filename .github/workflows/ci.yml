# CI for commercial-billing-service (LLD §13.3, §14.6).
#
# One job runs the same gates as `make ci` (fmt, vet, golangci-lint,
# go-arch-lint, the BIL-PCI-1 / BIL-OPS-2 guard scripts, race tests, build);
# others run schema-gov (`make schema-validate`), helm-check (chart, alert
# rules, chart contract tests) and a Dockerfile lint. Later phases add the
# integration suite (Postgres, floci, stripe-mock), the image build and
# Trivy, following the IAM services' workflows.
name: CI

"on":
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
  GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: golangci-lint
        run: make lint

      - name: go-arch-lint (LLD §3.2)
        run: make arch-lint

      - name: Guards (BIL-PCI-1, BIL-OPS-2)
        run: make guards

      - name: Tests (race)
        run: make test

      - name: Build
        run: make build

  helm:
    name: Helm check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.16.3

      - name: Install promtool and kubeconform
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin prometheus-3.5.0.linux-amd64/promtool
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7

      # LLD §13.1, §13.3: chart lint + kubeconform, alert rules, chart
      # contract tests (XFCC, OPERATOR_PATH_LIVE, CronJobs, operator routes).
      - name: helm-check
        run: make helm-check

  schema:
    name: Schema governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Installed from source as in the IAM services: the GHCR package's
      # Actions allow-list does not include this repository.
      - name: Install schema-gov (platform-schemagov v0.4.0)
        run: pip install --no-cache-dir "git+https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com/BCBP-SOLUTIONS-FZC-LLC/platform-schemagov.git@v0.4.0"
      - name: Embedded schemas in sync with api/asyncapi.yaml
        run: schema-gov extract --asyncapi api/asyncapi.yaml --schema-dir internal/adapters/eventbus/schemas --check
      - name: Validate
        run: schema-gov validate --asyncapi api/asyncapi.yaml --schema-dir internal/adapters/eventbus/schemas

  dockerfile:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
