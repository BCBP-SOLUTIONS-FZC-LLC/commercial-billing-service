asyncapi: 3.0.0

info:
  title: Commercial Billing Events
  version: "1.0.0"
  description: |
    Events produced by commercial-billing on billing.events, and the events it
    consumes (LLD §7). Source of truth for the produced JSON Schemas under
    internal/adapters/eventbus/schemas/ (generated with `make extract-schemas`).

    Topic            Glue registry    Produced events
    ──────────────────────────────────────────────────────────────────────
    billing-events   billing-events   TenantPlanChanged, TenantSeatsChanged,
                                      TenantPaymentPastDue, TenantSubscriptionCancelled,
                                      TenantReactivated, TenantQuotaAddOnChanged

    Wire format: the SNS message body is the platform-events envelope JSON. With
    the Glue codec, "data" carries [0x03][0x00][16-byte schema version UUID]
    [payload JSON]; consumers strip the 18-byte header (HLD §9.3). Payloads are
    open (additionalProperties: true) and carry tenant_id in data as well as in
    the envelope (D-1, HLD v0.65 §9.4). BillingPeriodRolled is not emitted.

    Ordering: rows for one tenant publish in commit order (ordered outbox,
    key tenant_id; BIL-EVT-5). `time` is Billing's clock at commit, strictly
    increasing within one transaction (BIL-EVT-1).

servers:
  billingEventsTopic:
    host: sns.ap-south-1.amazonaws.com
    protocol: sns
    description: SNS topic billing-events (Commercial IaC).
  tenantBillingQueue:
    host: sqs.ap-south-1.amazonaws.com
    protocol: sqs
    description: SQS tenant-billing-q (DLQ tenant-billing-q-dlq), subscribed to iam-tenant-events.
  usageBillingQueue:
    host: sqs.ap-south-1.amazonaws.com
    protocol: sqs
    description: SQS usage-billing-q (DLQ usage-billing-q-dlq), subscribed to usage-events.

channels:
  billingEvents:
    address: billing-events
    servers:
      - $ref: '#/servers/billingEventsTopic'
    description: |
      Subscribers (LLD §7.3.9):
        billing-orgm-q          Core               TenantPlanChanged, TenantSeatsChanged, TenantPaymentPastDue, TenantSubscriptionCancelled, TenantReactivated
        billing-authz-q         AuthZ Enrichment   TenantPlanChanged, TenantSubscriptionCancelled, TenantReactivated
        billing-realm-q         Realm Provisioner  TenantReactivated
        billing-audit-q         Audit Log          all six
        billing-entitlements-q  Entitlements       TenantPlanChanged, TenantSubscriptionCancelled, TenantReactivated, TenantQuotaAddOnChanged
        billing-notification-q  Notification       TenantPaymentPastDue, TenantSubscriptionCancelled
    messages:
      TenantPlanChanged:
        $ref: '#/components/messages/TenantPlanChanged'
      TenantSeatsChanged:
        $ref: '#/components/messages/TenantSeatsChanged'
      TenantPaymentPastDue:
        $ref: '#/components/messages/TenantPaymentPastDue'
      TenantSubscriptionCancelled:
        $ref: '#/components/messages/TenantSubscriptionCancelled'
      TenantReactivated:
        $ref: '#/components/messages/TenantReactivated'
      TenantQuotaAddOnChanged:
        $ref: '#/components/messages/TenantQuotaAddOnChanged'

operations:
  publishBillingEvents:
    action: send
    channel:
      $ref: '#/channels/billingEvents'
    summary: Billing publishes its state transitions through the ordered outbox.
    messages:
      - $ref: '#/channels/billingEvents/messages/TenantPlanChanged'
      - $ref: '#/channels/billingEvents/messages/TenantSeatsChanged'
      - $ref: '#/channels/billingEvents/messages/TenantPaymentPastDue'
      - $ref: '#/channels/billingEvents/messages/TenantSubscriptionCancelled'
      - $ref: '#/channels/billingEvents/messages/TenantReactivated'
      - $ref: '#/channels/billingEvents/messages/TenantQuotaAddOnChanged'

components:
  tags:
    published:
      name: published
      description: commercial-billing is the producer, on billing-events.

  messageTraits:
    glueWireFormat:
      description: |
        "data" is Glue-framed: [0x03][0x00][16-byte schema version UUID][payload JSON].

  messages:
    TenantPlanChanged:
      name: TenantPlanChanged
      x-lifecycle:
        status: active
      x-owner:
        team: commercial-billing
      title: Tenant Plan Changed
      summary: Upgrade payment confirmed, or a downgrade took effect at renewal (LLD §7.3.3).
      tags:
        - $ref: '#/components/tags/published'
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/TenantPlanChangedEnvelope'
    TenantSeatsChanged:
      name: TenantSeatsChanged
      x-lifecycle:
        status: active
      x-owner:
        team: commercial-billing
      title: Tenant Seats Changed
      summary: Post-conversion seat sync, seat purchase or top-up confirmed, renewal reduction, resync (LLD §7.3.4).
      tags:
        - $ref: '#/components/tags/published'
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/TenantSeatsChangedEnvelope'
    TenantPaymentPastDue:
      name: TenantPaymentPastDue
      x-lifecycle:
        status: active
      x-owner:
        team: commercial-billing
      title: Tenant Payment Past Due
      summary: Subscription moved active → past_due (LLD §7.3.5).
      tags:
        - $ref: '#/components/tags/published'
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/TenantPaymentPastDueEnvelope'
    TenantSubscriptionCancelled:
      name: TenantSubscriptionCancelled
      x-lifecycle:
        status: active
      x-owner:
        team: commercial-billing
      title: Tenant Subscription Cancelled
      summary: Subscription moved active or past_due → cancelled (LLD §7.3.5).
      tags:
        - $ref: '#/components/tags/published'
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/TenantSubscriptionCancelledEnvelope'
    TenantReactivated:
      name: TenantReactivated
      x-lifecycle:
        status: active
      x-owner:
        team: commercial-billing
      title: Tenant Reactivated
      summary: Subscription moved past_due or cancelled → active; source billing (LLD §7.3.5).
      tags:
        - $ref: '#/components/tags/published'
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/TenantReactivatedEnvelope'
    TenantQuotaAddOnChanged:
      name: TenantQuotaAddOnChanged
      x-lifecycle:
        status: active
      x-owner:
        team: commercial-billing
      title: Tenant Quota Add-On Changed
      summary: Token add-on purchase confirmed (reason purchase) or add-on refund succeeded (reason refund) (LLD §7.3.6).
      tags:
        - $ref: '#/components/tags/published'
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/TenantQuotaAddOnChangedEnvelope'

  schemas:
    # ── Envelope (platform-events; LLD §7.3.1) ──────────────────────────────
    EventEnvelopeBase:
      type: object
      required: [id, type, specversion, source, subject, tenant_id, time, data]
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7; consumer dedup key.
        type:
          type: string
        specversion:
          type: string
        source:
          type: string
          const: commercial-billing
        subject:
          type: string
          format: uuid
          description: Equals tenant_id (Core requires subject).
        tenant_id:
          type: string
          format: uuid
        time:
          type: string
          format: date-time
          description: Billing's clock at commit (BIL-EVT-1).
        dataschema:
          type: string
          description: Glue schema version UUID.
        actor:
          type: string
          description: Tenant user id, operator sub, or commercial-system for webhook / job / consumer driven changes.
        trace_id:
          type: string
        correlation_id:
          type: string
        ip_address:
          type: string
        user_agent:
          type: string
        data: {}

    TenantPlanChangedEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TenantPlanChangedPayload'
    TenantSeatsChangedEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TenantSeatsChangedPayload'
    TenantPaymentPastDueEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TenantPaymentPastDuePayload'
    TenantSubscriptionCancelledEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TenantSubscriptionCancelledPayload'
    TenantReactivatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TenantReactivatedPayload'
    TenantQuotaAddOnChangedEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TenantQuotaAddOnChangedPayload'

    # ── Produced payloads (open; LLD §7.3.3–§7.3.6) ─────────────────────────
    TenantPlanChangedPayload:
      type: object
      additionalProperties: true
      required: [tenant_id, plan, previous_plan, effective_at, billing_ref]
      properties:
        tenant_id:
          type: string
          format: uuid
        plan:
          type: string
          enum: [starter, pro, enterprise]
          description: New plan; the only field Core reads.
        previous_plan:
          type: string
          enum: [starter, pro, enterprise]
        direction:
          type: string
          enum: [upgrade, downgrade]
        effective_at:
          type: string
          format: date-time
        billing_ref:
          type: string
          description: plan_change_requests.change_id
        billing_subscription_id:
          type: string
          format: uuid

    TenantSeatsChangedPayload:
      type: object
      additionalProperties: true
      required: [tenant_id, licensed_seats, reason]
      properties:
        tenant_id:
          type: string
          format: uuid
        licensed_seats:
          type: integer
          minimum: 1
          maximum: 100000
          description: Absolute count (snapshot); Core applies it unconditionally (SEAT-2).
        previous_licensed_seats:
          type: [integer, 'null']
          minimum: 0
        reason:
          type: string
          enum: [conversion, purchase, renewal, renewal_topup, reactivation, resync]
        billing_ref:
          type: [string, 'null']
          description: seat_purchases.purchase_id, seat_change_schedules.schedule_id or billing_subscription_id
        billing_subscription_id:
          type: string
          format: uuid
        deferred_amount_minor:
          type: integer
          minimum: 1
          description: Additive (BL-OQ-6). Purchase only; prorated amount not charged (below the provider minimum), billed from renewal.
        deferral_reason:
          type: string
          enum: [below_provider_minimum]
          description: Additive (BL-OQ-6). Present only with deferred_amount_minor.

    TenantPaymentPastDuePayload:
      type: object
      additionalProperties: true
      required: [tenant_id, invoice_ref, past_due_since]
      properties:
        tenant_id:
          type: string
          format: uuid
        invoice_ref:
          type: string
          description: Billing invoice_id (UUID), never a provider id.
        amount_due:
          # Money (LLD §5.3), inlined: payload schemas are extracted standalone.
          type: object
          required: [amount_minor, currency]
          properties:
            amount_minor:
              type: integer
            currency:
              type: string
              pattern: '^[A-Z]{3}$'
        past_due_since:
          type: string
          format: date-time
        next_retry_at:
          type: [string, 'null']
          format: date-time

    TenantSubscriptionCancelledPayload:
      type: object
      additionalProperties: true
      required: [tenant_id, cancelled_at, reason]
      properties:
        tenant_id:
          type: string
          format: uuid
        cancelled_at:
          type: string
          format: date-time
          description: Billing commit time; Core uses COALESCE(cancelled_at, now()).
        reason:
          type: string
          enum: [dunning_exhausted, customer, auto_renew_off, operator_reversal]

    TenantReactivatedPayload:
      type: object
      additionalProperties: true
      required: [tenant_id, source, reactivated_at]
      properties:
        tenant_id:
          type: string
          format: uuid
          description: Required by Realm Provisioner's billing-realm-q schema (D-1).
        source:
          type: string
          const: billing
          description: RP-D13; RP emits source=operator on its own topic.
        reactivated_at:
          type: string
          format: date-time
        previous_status:
          type: string
          enum: [past_due, cancelled]

    TenantQuotaAddOnChangedPayload:
      type: object
      additionalProperties: true
      required: [tenant_id, resource, delta, reason, billing_ref]
      properties:
        tenant_id:
          type: string
          format: uuid
        resource:
          type: string
          enum: [llm_tokens, api_requests]
          description: Billing emits llm_tokens only in v1 (CD-55).
        delta:
          type: integer
          not:
            const: 0
          description: purchase > 0; refund < 0 (Entitlements removes at most the grant's unused tokens). Idempotent on billing_ref.
        reason:
          type: string
          enum: [purchase, refund]
        billing_ref:
          type: string
          description: purchase → quota_addon_purchases.purchase_id; refund → refunds.refund_id
        purchase_ref:
          type: string
          description: Refund only; purchase_id of the grant being reversed.
        purchased_at:
          type: string
          format: date-time
          description: Payment confirmation instant; basis of the 12-month expiry (BL-OQ-4).
        pack_code:
          type: string
        pack_quantity:
          type: integer
          minimum: 1
