# https://golangci-lint.run/docs/configuration/  (golangci-lint v2, run as a go tool)
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - exhaustive
    - forbidigo
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam

  settings:
    # LLD §11: every log, metric and span goes through platform-gincommon.
    # Only the two observability adapters may name the underlying types
    # (gincommon has no helper yet for span attributes and links, the span
    # id, the Prometheus AlreadyRegistered case or the Pushgateway); they
    # take the tracer, registry and logger from gincommon.
    depguard:
      rules:
        observability:
          files:
            - "$all"
            - "!$test"
            - "!**/internal/adapters/observability/**"
            - "!**/internal/adapters/metrics/**"
          deny:
            - pkg: "go.opentelemetry.io"
              desc: "spans go through port.Tracer / gincommon (adapters/observability)"
            - pkg: "github.com/prometheus"
              desc: "metrics go through port.Metrics / gincommon (adapters/metrics)"
            - pkg: "log$"
              desc: "logs go through gincommon's logger (port.Logger)"
            - pkg: "log/slog"
              desc: "logs go through gincommon's logger (port.Logger)"
            - pkg: "go.uber.org/zap"
              desc: "logs go through gincommon's logger (port.Logger)"
    # A default branch is an explicit choice for the rest of an enum (as with
    # provider enums Billing does not mirror).
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: var-naming
        - name: error-return
        - name: error-strings
        - name: error-naming
    forbidigo:
      analyze-types: true
      forbid:
        # BIL-OPS-1: every pool comes from pgcommon.NewPool (LLD §3.2).
        - pattern: 'pgxpool\.(New|NewWithConfig|Connect)$'
          msg: "BIL-OPS-1: construct pools only via pgcommon.NewPool"
        - pattern: 'pgx\.Connect(Config)?$'
          msg: "BIL-OPS-1: construct connections only via pgcommon.NewPool"
        - pattern: 'sql\.Open$'
          msg: "BIL-OPS-1: this service uses pgx/pgcommon, not database/sql"
  exclusions:
    rules:
      - path: '_test\.go'
        linters: [revive, unparam, noctx]
      - path: '^cmd/'
        linters: [revive]
      - path: '^test/'
        linters: [revive, unparam, noctx]
